services:
  bot:
    image: ghcr.io/truesammy/translator:latest  # built by GitHub Actions on every push to main
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/bot.db  # wins over an empty DATABASE_PATH= line in .env
    volumes:
      - data:/data  # the SQLite database lives here and survives rebuilds

volumes:
  data:
